name: Publish image

# Build + push the sentinel image to GHCR on version tags. This image is what action.yml
# points at, so consumers stop rebuilding the Dockerfile on every run. Delete/prune later
# via the package UI, the API, or a retention policy — nothing here is irreversible.
#
# NOTE: the GHCR package must be set to public manually after the first push. Until then
# every *other* repository's run fails with an authentication error while this repo's own
# runs succeed. GITHUB_TOKEN cannot change package visibility.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chain-registry-sentinel
          # latest=auto tags `latest` only for the highest *stable* release, never a pre-release (rc).
          flavor: latest=auto
          # Literal `v` in the pattern, so the image tag is the git tag verbatim (v0.5.2, not
          # 0.5.2). One version string across the git tag, the action ref consumers write, the
          # image tag, action.yml's `image:` value, and what `sentinel --version` prints. The
          # v-less {{version}} form would make the published binary disagree with a local
          # `make build`, which stamps `git describe` output.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch

      # Guard against tagging a release whose action.yml still points at the previous
      # image (or at 'Dockerfile'). Without this, such a release succeeds and silently
      # ships the wrong binary under a new version. Derived from the git tag, which is
      # also what the image is tagged with, so action.yml reads `:v0.5.2` — the same
      # string consumers put after the `@` in `uses:`.
      - name: Assert action.yml image ref matches this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="docker://ghcr.io/${{ github.repository_owner }}/chain-registry-sentinel:${{ github.ref_name }}"
          actual=$(awk -F"['\"]" '/^[[:space:]]*image:/ {print $2; exit}' action.yml)
          if [ "$actual" != "$expected" ]; then
            echo "::error::action.yml image ref does not match the tag being released."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            echo "Bump the 'image:' value in action.yml, commit, then re-tag."
            exit 1
          fi
          echo "action.yml image ref OK: $actual"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Stamp the image version; overrides the "dev" default in the Dockerfile's ARG so
          # `sentinel --version` reports the release. Uses the ref name (v0.5.2 on a tag,
          # the branch name on dispatch) rather than metadata-action's computed version, so
          # the stamp matches the image tag, the goreleaser binaries, and `make build` — all
          # four now derive from the git tag with no v-stripping anywhere.
          build-args: |
            VERSION=${{ github.ref_name }}