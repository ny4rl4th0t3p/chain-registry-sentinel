name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history + all tags to build the changelog from the commit
          # range since the previous tag. The default shallow clone (fetch-depth: 1) gives it only
          # the tagged commit, so the changelog captured just the last commit and mis-grouped it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Explicit major, never 'latest': @v5's 'latest' silently locked to GoReleaser v1,
          # which rejects our version: 2 config — exactly the class of surprise a pin avoids.
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}